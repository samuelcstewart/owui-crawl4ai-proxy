# Project-pinned toolchain. CI installs mise (jdx/mise-action) and reads
# this file, so the pins below are the single source for workflow runs.
# The Dockerfile pins its builder images separately (COPY --from) — keep
# python aligned with the python:X-slim-bookworm base image and uv with
# the ghcr.io/astral-sh/uv image; Renovate groups each pair into one PR.
[tools]
python = "3.14"
uv = "0.13.8"
