[project]
name = "owui-crawl4ai-proxy"
version = "0.3.0"
description = "Bridge between Open WebUI's external web loader interface and crawl4ai"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Sam Stewart", email = "sam@stew.foo" },
]
# Runtime deps. The Dockerfile runs `uv sync --frozen --no-dev --no-editable`
# against this file, so adding/removing a dep here is the only place the
# runtime image needs to be touched.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owui_crawl4ai_proxy"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty>=0.0.1a5",
    "poethepoet>=0.36",
]

# ---- ruff ----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["owui_crawl4ai_proxy"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers use `Depends(...)` as a default argument by
# design — that's the framework's dependency-injection contract.
"src/owui_crawl4ai_proxy/main.py" = ["B008"]

# ---- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Skip `integration` tests by default — they require a real crawl4ai
# running on localhost:11235. Run them via `poe integration-test`,
# which orchestrates the lifecycle. `-m "not integration"` here means
# `poe test` (and `poe check`) never hit the network.
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: end-to-end tests that hit a real crawl4ai instance (run via `poe integration-test`)",
]

# ---- poe -----------------------------------------------------------------
# Higher-level entry points. The naming follows the convention
# build / lint / test so `poe <verb>` is the muscle-memory entry point.
# Legacy `docker-build-local` is preserved as an alias for callers that
# already use it.
#
# `build` — multi-arch (amd64+arm64) image, --load into the local Docker
#           daemon. Requires Docker 29+ with the containerd image store
#           (snapshotter) enabled — that's what makes `--load` accept a
#           multi-platform build. On classic single-platform storage
#           you'll get an error; the fix is to enable containerd
#           snapshotter in /etc/docker/daemon.json (`features.containerd
#           -snapshotter: true`) and restart the daemon.
#
# Pushing the image to a registry is intentionally NOT exposed as a poe
# task — bring your own registry credentials and run `docker buildx
# build --push` (or compose) however suits your environment.

[tool.poe.env]
PROXY_HEALTH_URL = { default = "http://localhost:8000/health" }

[tool.poe.tasks.build]
help = "Build a multi-arch (linux/amd64 + linux/arm64) image and load it into the local Docker daemon. Requires Docker 29+ with the containerd image store enabled."
shell = """
docker buildx build \\
  --platform linux/amd64,linux/arm64 \\
  -t owui-crawl4ai-proxy:local \\
  --load \\
  .
"""

[tool.poe.tasks.lint]
help = "ruff check (lint)"
cmd = "ruff check"

[tool.poe.tasks.test]
help = "Run unit tests (skips integration tests — use `poe integration-test` for those)"
cmd = "pytest"

[tool.poe.tasks.integration-test]
help = "Stand up crawl4ai via docker compose, run the integration test suite against the running proxy, then tear the stack down"
shell = """
set -euo pipefail
cleanup() {
  # Always strip the stack down, even on failure / SIGINT.
  docker compose down --remove-orphans >/dev/null 2>&1 || true
}
trap cleanup EXIT

echo ">> building + bringing up crawl4ai + proxy"
docker compose up -d --build --remove-orphans

echo ">> waiting for proxy health at $PROXY_HEALTH_URL"
for i in $(seq 1 60); do
  if curl --silent --fail --max-time 2 "$PROXY_HEALTH_URL" >/dev/null 2>&1; then
    echo ">> proxy healthy after ${i}s"
    break
  fi
  if [ "$i" = "60" ]; then
    echo "!! proxy never became healthy within 60s; dumping compose logs" >&2
    docker compose logs --no-color --tail=200 >&2 || true
    exit 1
  fi
  sleep 1
done

echo ">> running integration tests"
uv run pytest -m integration -v --tb=short
"""

[tool.poe.tasks.format]
help = "ruff format (write)"
cmd = "ruff format"

[tool.poe.tasks.format-check]
help = "ruff format --check (CI gate)"
cmd = "ruff format --check"

[tool.poe.tasks.typecheck]
help = "ty type-check"
cmd = "ty check"

[tool.poe.tasks.check]
help = "Run lint + format-check + typecheck + tests — full CI gate (skips integration tests)"
sequence = ["lint", "format-check", "typecheck", "test"]


[tool.poe.tasks.check-style]
help = "Lint + format check (CI mode)"
sequence = ["lint", "format-check"]


[tool.poe.tasks.fix]
help = "Auto-fix lint and format issues"
sequence = ["lint-fix", "format"]


[tool.poe.tasks.lint-fix]
help = "Lint with auto-fix"
cmd = "ruff check --fix"


# Legacy alias kept so any external scripts that reference the old
# name continue to work.
[tool.poe.tasks.docker-build-local]
help = "Alias for `poe build` (legacy name)"
sequence = ["build"]
